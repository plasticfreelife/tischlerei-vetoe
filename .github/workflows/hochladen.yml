# Lädt den Ordner website/ bei jeder Änderung auf main per FTPS zu ALL-INKL hoch.
# Zugangsdaten liegen als Secrets im Repository (Settings → Secrets and variables → Actions).
name: Website zu ALL-INKL hochladen

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/hochladen.yml"]
  workflow_dispatch:

concurrency:
  group: hochladen
  cancel-in-progress: false

jobs:
  hochladen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Per FTPS hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./website/
          server-dir: ${{ vars.FTP_ZIELORDNER || './' }}
